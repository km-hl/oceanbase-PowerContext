services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    container_name: funverse-seekdb
    restart: unless-stopped
    environment:
      ROOT_PASSWORD: \${SEEKDB_ROOT_PASSWORD:?set a strong password in .env}
      SEEKDB_DATABASE: funverse
    volumes:
      - seekdb-data:/var/lib/seekdb
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -p\"$$ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 60
    networks: [funverse]

  funverse-api:
    build: .
    container_name: funverse-api
    restart: unless-stopped
    depends_on:
      seekdb:
        condition: service_healthy
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: \${SEEKDB_ROOT_PASSWORD:?set a strong password in .env}
      SEEKDB_DATABASE: funverse
      FUN_API_TOKEN: \${FUN_API_TOKEN:?set a random token in .env}
    ports:
      - "127.0.0.1:8765:8765"
    networks: [funverse]

volumes:
  seekdb-data:

networks:
  funverse:
    name: funverse-network
