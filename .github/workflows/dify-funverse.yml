name: Dify FunVerse checks

on:
  push:
    branches: [dify]
    paths:
      - "examples/dify-funverse/**"
      - ".github/workflows/dify-funverse.yml"
  pull_request:
    paths:
      - "examples/dify-funverse/**"
      - ".github/workflows/dify-funverse.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/dify-funverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway and test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10" "httpx>=0.27,<1" "PyYAML>=6,<7"
      - name: Run offline contract tests
        run: python -m pytest -q tests/
