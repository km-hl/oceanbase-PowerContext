name: StepFun Knowledge Lab checks

on:
  push:
    branches: [StepFun]
    paths:
      - "projects/stepfun-seekdb/**"
      - ".github/workflows/stepfun-knowledge-lab.yml"
  pull_request:
    paths:
      - "projects/stepfun-seekdb/**"
      - ".github/workflows/stepfun-knowledge-lab.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python dependencies
        run: python -m pip install -r projects/stepfun-seekdb/backend/requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q projects/stepfun-seekdb/backend/tests/test_app.py
      - name: Frontend dependencies
        working-directory: projects/stepfun-seekdb/frontend
        run: npm install --no-audit --no-fund
      - name: Frontend tests
        working-directory: projects/stepfun-seekdb/frontend
        run: npm test
      - name: Production bundle
        working-directory: projects/stepfun-seekdb/frontend
        run: npm run build
