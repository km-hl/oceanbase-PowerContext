name: Competition evidence checks
on:
  push:
    branches: [2026-competition]
    paths:
      - 'src/powercontext/builtin/runtime/prepared_evidence.py'
      - 'src/powercontext/builtin/runtime/prepared_context.py'
      - 'tests/test_retrieval_quality_regressions.py'
      - 'competition/challenges/context-01-evidence-selection/**'
      - '.github/workflows/competition-evidence-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: '0.10.12'
      - name: Install frozen public test environment
        run: make -C competition install
      - name: Run official public challenge tests
        run: make -C competition test-evidence
      - name: Run evidence contract regressions
        run: |
          PYTHONPATH=src competition/.venv/bin/python -m pytest -q \
            tests/test_retrieval_quality_regressions.py \
            tests/test_competition_runtime_regressions.py
      - name: SciFact public-data quality sample
        run: |
          mkdir -p "$RUNNER_TEMP/scifact"
          curl -fsSL --retry 3 "https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz" -o "$RUNNER_TEMP/scifact/data.tar.gz"
          tar -xzf "$RUNNER_TEMP/scifact/data.tar.gz" -C "$RUNNER_TEMP/scifact"
          data_file=$(find "$RUNNER_TEMP/scifact" -type f -name corpus.jsonl -print -quit)
          if [ -z "$data_file" ]; then echo "SciFact corpus missing"; exit 1; fi
          data_dir=$(dirname "$data_file")
          PYTHONPATH=src competition/.venv/bin/python scripts/evaluate_evidence_quality.py \
            --native --all-candidates --data-dir "$data_dir" \
            --output "$RUNNER_TEMP/evidence-dev.json"
          PYTHONPATH=src competition/.venv/bin/python scripts/evaluate_evidence_quality.py \
            --native --all-candidates --data-dir "$data_dir" --claims claims_train.jsonl \
            --output "$RUNNER_TEMP/evidence-train.json"
          SCIFACT_DATA_DIR="$data_dir" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SCIFACT_DATA_DIR"])
          temp = Path(os.environ["RUNNER_TEMP"])
          corpus = {
              str(row["doc_id"]): row
              for row in (json.loads(line) for line in (root / "corpus.jsonl").read_text().splitlines())
          }
          for split, outfile in (("dev", "evidence-dev.json"), ("train", "evidence-train.json")):
              report = json.loads((temp / outfile).read_text())
              claims = {
                  row["id"]: row
                  for row in (json.loads(line) for line in (root / ("claims_" + split + ".jsonl")).read_text().splitlines())
              }
              print("HARD_PUBLIC_CASES", split)
              seen = set()
              for case in sorted(report["cases"], key=lambda row: row["recall"]):
                  if case["claim"] in seen:
                      continue
                  seen.add(case["claim"])
                  claim = claims[case["claim"]]
                  document = corpus[case["doc"]]
                  sentences = sorted({
                      index
                      for rationale in claim["evidence"].get(case["doc"], ())
                      for index in rationale["sentences"]
                  })
                  gold = " | ".join(document["abstract"][index] for index in sentences)
                  chosen = " | ".join(fragment["text"] for fragment in case["selected"])
                  print(
                      "CASE", case["claim"], "recall", round(case["recall"], 3),
                      "complete", case["complete"], "query", case["query"][:140],
                      "gold", gold[:380], "chosen", chosen[:360]
                  )
                  if len(seen) == 14:
                      break
          PY
